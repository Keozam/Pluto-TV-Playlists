name: Auto Pluto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js
- name: Agregar CUID para xTeVe
    run: |
      python3 << 'PYEOF'
      import glob, re
      for f in glob.glob("**/*.m3u*"):
          t = open(f, encoding="utf-8", errors="ignore").read()
          t = re.sub(r'#EXTINF:-1 tvg-id="([^"]+)"', r'#EXTINF:-1 CUID="\1" tvg-id="\1"', t)
          open(f, "w", encoding="utf-8").write(t)
      PYEOF
      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -f output/
          git commit -m "Auto update playlist" || echo "No changes"
          git push 
