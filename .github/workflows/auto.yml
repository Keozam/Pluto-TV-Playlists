name: Auto Pluto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js
- name: Agregar CUID para xTeVe
    run: |
      find . -type f \( -name ".m3u" -o -name ".m3u8" \) -exec sed -i -E '/CUID=/! s/#EXTINF:-1 tvg-id="([^"]+)"/#EXTINF:-1 CUID="\1" tvg-id="\1"/g' {} +
      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -f output/
          git commit -m "Auto update playlist" || echo "No changes"
          git push 
